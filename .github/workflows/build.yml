name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kaynak kod
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds dalı
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"

      - name: Eski derlemeleri temizle
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Eklentileri derle
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson --no-daemon
          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds/
          cp build/plugins.json $GITHUB_WORKSPACE/builds/

      - name: Plugin linklerini CDN'e yönlendir
        run: |
          cd $GITHUB_WORKSPACE/builds
          sed -i "s#https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/builds/#https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@builds/#g" plugins.json

      - name: Derlemeleri yükle
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit --amend -m "Build $GITHUB_SHA" || exit 0
          git push --force
